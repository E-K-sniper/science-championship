# Render Blueprint —Science Championship API
# Deploy: Render Dashboard → New → Blueprint → connect repo → Apply
services:
  - type: web
    name: science-championship-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      # DATABASE_PATH: for paid plans with persistent disk, set to the disk mount path
      # - key: DATABASE_PATH
      #   value: /var/data
    # For persistent disk on paid plans, uncomment:
    # disk:
    #   name: science-data
    #   mountPath: /var/data
    #   sizeGB: 1
